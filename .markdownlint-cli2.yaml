# https://github.com/DavidAnson/markdownlint-cli2#markdownlint-cli2yaml
#
# This is the `.markdownlint-cli2.*` form of the config rather than the
# more portable `.markdownlint.*` form, because only this form carries
# the `gitignore` setting below. Both markdownlint entry points this
# project uses — the markdownlint-cli2 pre-commit hook and the
# DavidAnson.vscode-markdownlint extension — read it.

# Skip everything git skips, so markdownlint matches the rest of the
# toolchain instead of walking build output and scratch space
# (`site/`, `node_modules/`, `.venv/`, `untracked/`). `true` honors
# nested .gitignore files up to the repository root, not just the one
# at the root — .superpowers/sdd/.gitignore is one that matters.
#
# This also applies when markdownlint-cli2 is handed explicit paths
# rather than globs, which is how the pre-commit hook invokes it.
gitignore: true

# https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.yaml
config:
  # Default state for all rules
  default: true

  # MD013/line-length : Line length
  # https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md013.md
  MD013: false

  # MD052/reference-links-images : Reference links and images should use a
  # label that is defined
  #
  # This is disabled because mkdocstrings uses reference links to refer to
  # documented objects. For example, if docs were inserted via:
  #
  # ::: my_package.my_module.MyClass
  #
  # this could be referenced in the docs using the following reference link:
  #
  # [my_package.my_module.MyClass][]
  #
  # For these reference links, no associated label is defined, causing the
  # linter to flag them.
  #
  # TODO @cdwilson: investigate a way to avoid having to disable this for all
  # reference links and images.
  MD052: false

  # MD046/code-block-style : Code block style
  # https://github.com/DavidAnson/markdownlint/blob/v0.41.0/doc/md046.md
  #
  # Material for MkDocs "content tabs" used in the docs causes this rule to
  # fail.
  MD046: false

  # MD033/no-inline-html : Inline HTML
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md033.md
  #
  # The README uses a <picture> element for the light/dark logo lockup
  # (GitHub's documented approach for theme-aware images; PyPI falls back
  # to the inner <img>).
  MD033:
    allowed_elements:
      - picture
      - source
      - img
      - br
      - p

  # Keep a Changelog repeats section headings (Added/Changed/Fixed) across
  # version entries; only flag duplicates among sibling headings.
  MD024:
    siblings_only: true
